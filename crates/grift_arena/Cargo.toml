[package]
name = "grift_arena"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "a minimal no_std, no_alloc arena allocator with garbage collection for grift"
repository = "https://github.com/gold-silver-copper/grift"
documentation = "https://docs.rs/grift_arena"
keywords = ["arena", "allocator", "no_std", "embedded", "gc"]
